# Builds the Pedigree image and smoke-tests the running service on every pull request into
# main and every push to it. Pedigree is an R plumber service with no test suite of its own,
# so the image build (which installs Pedixplorer from Bioconductor) and the probes of
# ci/smoke.sh against the running container are what prove a change still serves a pedigree.
# The release workflow (maven.yml) runs the same script on the image it is about to push.
#
# The job name is the status check the branch ruleset on main requires; rename both together.
#
# Actions are pinned to a commit, with the version it belongs to beside it; move both together.

name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    name: Build image and smoke-test
    runs-on: ubuntu-latest
    # The Bioconductor install dominates; a cold build takes well over ten minutes.
    timeout-minutes: 60

    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Single platform and no push: the multi-arch release image is maven.yml's job. The
      # layer cache keeps the R package install from repeating on every run.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: elicitsoftware/pedigree:ci
          cache-from: type=gha
          cache-to: type=gha

      # Starts the service with a service token of the script's own (a literal for this test,
      # not a secret), waits for /healthz, checks that /svg refuses a request without the
      # token and renders ped1.txt, the sample pedigree the README posts, with it; then checks
      # a start without a token and one with a token that is too short. Prints the service
      # log if a check fails.
      - name: Smoke-test the image
        run: ci/smoke.sh elicitsoftware/pedigree:ci
